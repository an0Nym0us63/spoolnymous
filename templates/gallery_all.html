{% extends "base.html" %}
{% block styles %}
<style>
:root{
  --thumb-size: 180px;
  --tile-bg: color-mix(in oklab, var(--bs-body-bg) 90%, var(--bs-primary) 10%);
  --tile-border: color-mix(in oklab, var(--bs-border-color) 80%, var(--bs-primary) 20%);
}

/* Page */
body.gallery-page{ overflow-y:auto; background:var(--bs-body-bg); }

/* Header sticky */
.gallery-header{
  position:sticky; top:0; z-index:1030;
  backdrop-filter:blur(6px);
  background: color-mix(in oklab, var(--bs-body-bg) 85%, transparent);
  border-bottom:1px solid rgba(255,255,255,.08);
}

/* Grille principale */
.g-grid{
  --g-thumb-size: 220px;
  display:grid;
  grid-template-columns: repeat(auto-fill, minmax(var(--g-thumb-size), 1fr));
  gap:1rem;
}

 .album-card.tile{
   position:relative;
   cursor:pointer;
   border-radius:.75rem;
   /* overflow:hidden;   ⟵ enlever le clipping au niveau de la carte */
   background:var(--tile-bg);
   border:1px solid var(--tile-border);
   box-shadow:0 1px 3px rgba(0,0,0,.06);
   transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;
 }
.album-card.tile:hover{
  transform:translateY(-1px);
  box-shadow:0 6px 14px rgba(0,0,0,.10);
}

 .thumb-wrap{
   position:relative;
   width:100%;
   aspect-ratio:1/1;
   background:#0f1218;
   overflow:hidden;                      /* ⟵ cutter uniquement l’image */
   border-top-left-radius:.75rem;        /* ⟵ conserver les coins arrondis */
   border-top-right-radius:.75rem;
 }
.thumb{
  position:absolute; inset:0;
  width:100%; height:100%;
  object-fit:cover; object-position:center;
  display:block;
}

/* Chip compteur en bas-gauche */
.badge-chip{
  position:absolute; left:.5rem; bottom:.5rem;
  display:inline-flex; align-items:center; gap:.35rem;
  padding:.2rem .45rem;
  font-size:.72rem; line-height:1;
  background:var(--bs-body-bg);
  color:var(--bs-body-color);
  border:1px solid var(--bs-border-color);
  border-radius:.5rem;
  box-shadow:0 1px 2px rgba(0,0,0,.06);
}
.badge-chip .bi{ opacity:.85; font-size:.85rem; }

/* Métadonnées */
.meta{
  background:inherit;
  padding:.5rem .6rem; font-size:.7rem;
  border-top:1px solid color-mix(in oklab, var(--tile-border) 70%, transparent);
}
.meta .line1{
  display:flex; align-items:center; gap:.4rem;
  white-space:nowrap; overflow:hidden;
}
.meta .line1 .text-truncate{ min-width:0; }
.meta .line2{
  font-size:.7rem; opacity:.8; margin-top:.15rem;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}

/* Globe MakerWorld à droite */
.mw-link{ margin-left:auto; display:inline-flex; align-items:center; }
.mw-link .mw-icon{ display:inline-flex; align-items:center; }
.mw-link .bi{ font-size:.9rem; opacity:.85; }
.mw-link:hover{ opacity:1; }

/* Search bar */
.search-inner{ display:flex; justify-content:center; }
.search-input{ width: min(720px, 100%); }
.search-input .input-group-text,
.search-input .form-control,
.search-input .btn{
  background: var(--bs-body-bg);
  border-color: var(--bs-border-color);
}
@media (max-width: 576px){
  .search-input{ width:100%; }
}

/* Lightbox */
.lightbox{ position:fixed; inset:0; z-index:2000; display:none; background:rgba(0,0,0,.92); }
.lightbox.open{ display:grid; place-items:center; }
.lightbox img{ max-width:92vw; max-height:86vh; object-fit:contain; box-shadow:0 0 0 1px rgba(255,255,255,.08); border-radius:.5rem; }
.lb-toolbar{ position:fixed; top:.5rem; left:.5rem; right:.5rem; display:flex; align-items:center; justify-content:space-between; gap:.5rem; flex-wrap:nowrap; }
.lb-actions{ display:flex; gap:.5rem; }
.lb-index{ color:#fff; opacity:.8; font-size:.9rem; flex-shrink:0; }
.lb-nav{ position:fixed; inset:0; display:flex; align-items:center; justify-content:space-between; pointer-events:none; }
.lb-nav .btn{ pointer-events:all; border-radius:999px; }
#lbName{ max-width:70vw; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

@media (max-width:576px){
  .lb-toolbar{ flex-wrap:wrap; gap:.25rem; }
  #lbName{ max-width:100%; white-space:normal; line-height:1.2; text-overflow:clip; }
  .lb-index{ width:100%; text-align:left; font-size:.8rem; opacity:.7; }
  .container{ padding-left:.5rem; padding-right:.5rem; }
  .g-grid{ grid-template-columns: repeat(2, minmax(0, 1fr)) !important; gap:.6rem !important; }
}

/* Divers */
q::placeholder{ opacity:.7; }
#sentinel.empty{ color:var(--bs-secondary-color); }
.swal2-container{ z-index:3000 !important; }
/* === FIX COINS BAS === */
.album-card.tile{
  border-radius:.75rem;         /* arrondi unique */
  overflow:hidden;
  background:var(--tile-bg);
  border:1px solid var(--tile-border);
}

/* enfants forcés carrés et même fond */
.album-card .thumb-wrap,
.album-card .meta,
.album-card .patchwork{
  border-radius:0 !important;
  background:inherit !important;
}

/* supprimer tout gradient / transparent qui bave */
.album-card .meta{
  background:var(--tile-bg) !important;
  border-top:none !important;
}

/* ceinture + bretelles : masque de fond sur le bas */
.album-card::after{
  content:"";
  position:absolute;
  left:0; right:0; bottom:0;
  height:8px;
  background:var(--tile-bg);
  pointer-events:none;
}/* === Harmonisation exacte avec filaments_gallery === */
:root{
  --tile-bg: #0f172a;                 /* même fond de tuile */
  --tile-border-rgba: rgba(255,255,255,.08);
}

/* Tuile (carte) */
.album-card.tile{
  background: var(--tile-bg) !important;
  border: 1px solid var(--tile-border-rgba) !important;
  box-shadow: 0 4px 12px rgba(0,0,0,.2) !important;
}

/* Fond de la zone image (thumb) */
.album-card .thumb-wrap{
  background: #111827 !important;
}

/* Pas de trait entre image et méta (tu ne voulais plus la ligne) */
.album-card .meta{
  border-top: none !important;
  background: var(--tile-bg) !important;  /* homogène */
}
/* Actions (menu à la place du globe) */
.album-card .actions { margin-left:auto; display:flex; align-items:center; }
.album-card .actions .btn.action-btn { padding:.15rem .45rem; line-height:1; }

/* Liste filaments dans la modal */
.fila-row{ display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:.5rem; padding:.4rem .25rem; }
.fila-row + .fila-row{ border-top:1px dashed var(--bs-border-color); }
.fila-swatch{ width:14px; height:14px; border-radius:9999px; border:1px solid rgba(0,0,0,.2); box-shadow: inset 0 0 0 1px rgba(255,255,255,.15); }
.fila-name a{ text-decoration:none; }
.fila-name a:hover{ text-decoration:underline; }
</style>
{% endblock %}


{% block content %}
<main class="gallery-page">
  <div class="container py-3">
    <!-- Search bar -->
    <div id="searchBar" class="mb-3">
      <div class="input-group">
        <span class="input-group-text bg-dark-subtle"><i class="bi bi-search"></i></span>
        <input id="q" type="search" class="form-control" placeholder="Rechercher un print, un groupe, un tag…">
        <button id="qClear" class="btn btn-outline-secondary" type="button" title="Effacer">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>
    </div>

    <!-- Gallery -->
    <div id="grid" class="g-grid"></div>
    <div id="sentinel" class="py-4 text-center text-secondary">Chargement…</div>
  </div>
</main>

<!-- Lightbox -->
<div id="lightbox" class="lightbox" aria-hidden="true">
  <div class="lb-toolbar">
    <div class="lb-actions">
      <button id="lbClose" class="btn btn-light btn-sm" title="Fermer (Esc)"><i class="bi bi-x-lg"></i></button>
      <button id="lbDelete" class="btn btn-danger btn-sm js-del-photo" title="Supprimer" data-requires-write><i class="bi bi-trash3"></i></button>
      <span id="lbName" class="badge text-bg-dark"></span>
    </div>
    <div class="lb-index"><span id="lbIdx">1</span> / <span id="lbTotal">1</span></div>
  </div>
  <img id="lbImg" alt="">
  <div class="lb-nav px-2">
    <button id="lbPrev" class="btn btn-outline-light"><i class="bi bi-chevron-left"></i></button>
    <button id="lbNext" class="btn btn-outline-light"><i class="bi bi-chevron-right"></i></button>
  </div>
</div>
<div class="modal fade" id="actionsModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-sm">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">
          <i class="bi bi-three-dots-vertical me-2"></i>
          Actions
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
      </div>
      <div class="modal-body p-0">
        <div class="list-group list-group-flush">
          <button type="button" id="actViewFilaments" class="list-group-item list-group-item-action">
            <i class="bi bi-palette2 me-2"></i>Voir les filaments
          </button>
          <a id="actMakerWorld" class="list-group-item list-group-item-action d-none" target="_blank" rel="noopener">
            <i class="bi bi-globe2 me-2"></i>Voir sur MakerWorld
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
<!-- Modal: Filaments utilisés -->
<div class="modal fade" id="filamentsModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-scrollable modal-md">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">
          <i class="bi bi-palette2 me-2"></i>
          Filaments utilisés
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
      </div>
      <div class="modal-body">
        <div id="filamentsList" class="list-unstyled m-0"></div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
{{ super() }}
<script>
(function setNavbarOffset(){
  const nav = document.querySelector('.navbar');
  const apply = () => {
    const h = nav ? nav.offsetHeight : 56;
    document.documentElement.style.setProperty('--navbar-h', `${h}px`);
  };
  apply();
  window.addEventListener('resize', apply, { passive: true });
})();
// === ÉTAT & DOM ==============================================================
const grid = document.getElementById('grid');
const sentinel = document.getElementById('sentinel');
const state = {
  page: 1, per: 60, loading: false, done: false,
  q: ''   // 👈 ajoutés
};
const params = new URLSearchParams(location.search);
const qInput = document.getElementById('q');
const qClear = document.getElementById('qClear');
const entRadios = { all: document.getElementById('entAll'),
                    prints: document.getElementById('entPrints'),
                    groups: document.getElementById('entGroups') };

state.q = params.get('q') || '';
qInput.value = state.q;

// Index d'albums (front) : key = "entity:id" → { entity,id,title,cardEl,photos:[{url,name,base}] }
const albums = new Map();

// Lightbox custom (ids fournis par ton HTML)
const LB = {
  root: document.getElementById('lightbox'),
  img:  document.getElementById('lbImg'),
  name: document.getElementById('lbName'),
  idx:  document.getElementById('lbIdx'),
  total:document.getElementById('lbTotal'),
  btnPrev: document.getElementById('lbPrev'),
  btnNext: document.getElementById('lbNext'),
  btnClose: document.getElementById('lbClose'),
  btnDelete: document.getElementById('lbDelete'),
  albumKey: null,
  index: 0,
};

// Références de la modale Actions
const AM = {
  el: document.getElementById('actionsModal'),
  btnFilaments: document.getElementById('actViewFilaments'),
  aMaker: document.getElementById('actMakerWorld'),
  bs: null,
  currentCard: null
};
AM.bs = bootstrap.Modal.getOrCreateInstance(AM.el);

// Ouvre la modale et configure les actions selon la carte
function openActionsModal(card){
  AM.currentCard = card;

  // Filaments : simple bouton -> ouvre la modal des filaments existante
  AM.btnFilaments.onclick = () => {
    AM.bs.hide();
    showFilamentsFor(card);
  };

  // MakerWorld : visible seulement s'il y a une URL
  const key = card.dataset.key;
  const a = albums.get(key);
  if (a?.makerworldUrl) {
    AM.aMaker.classList.remove('d-none');
    AM.aMaker.href = a.makerworldUrl;
  } else {
    AM.aMaker.classList.add('d-none');
    AM.aMaker.removeAttribute('href');
  }

  AM.bs.show();
}

function parseAlbumKeyFromUrl(url){
  try{
    const parts = new URL(url, window.location.origin).pathname.split('/');
    const entity = parts[3]; // prints | groups
    const id = parseInt(parts[4], 10);
    if(!entity || Number.isNaN(id)) return null;
    return { key:`${entity}:${id}`, entity, id };
  }catch{ return null; }
}

function albumTitle(entity, id, itemTitle){
  return itemTitle || (entity === 'prints' ? `Print #${id}` : `Group #${id}`);
}

function buildUrl(){
  const u = new URL('/api/gallery/photos', window.location.origin);
  u.searchParams.set('page', state.page);
  u.searchParams.set('per', state.per);
  if (state.q) u.searchParams.set('q', state.q);
  return u;
}

function resetAndReload(){
  // reset pagination + UI
  state.page = 1;
  state.done = false;
  state.loading = false;

  albums.clear();
  grid.innerHTML = '';
  sentinel.classList.remove('empty');
  sentinel.textContent = 'Chargement…';

  // push état dans l’URL
  const usp = new URLSearchParams(location.search);
  if (state.q && state.q.trim()) usp.set('q', state.q.trim());
  else usp.delete('q');
  history.replaceState(null, '', `${location.pathname}?${usp.toString()}`);

  // relance le chargement
  loadNext();
}

function debounce(fn, ms=250){
  let t;
  return (...args)=>{ clearTimeout(t); t=setTimeout(()=>fn(...args), ms); };
}

// === LIGHTBOX ================================================================
function lbOpen(albumKey, startIndex=0){
  const a = albums.get(albumKey);
  if(!a || !a.photos.length) return;
  LB.albumKey = albumKey;
  LB.index    = Math.min(Math.max(0, startIndex), a.photos.length-1);
  lbRender();
  LB.root.classList.add('open');
}

function lbClose(){ LB.root.classList.remove('open'); }

function lbMove(delta){
  const a = albums.get(LB.albumKey);
  if(!a) return;
  LB.index = (LB.index + delta + a.photos.length) % a.photos.length;
  lbRender();
}

function lbRender(){
  const a = albums.get(LB.albumKey);
  const p = a.photos[LB.index];
  const specific = p.base || p.name || '';
  LB.name.textContent = specific ? `${a.title} - ${specific}` : a.title;
  LB.img.src = p.url;
  LB.img.alt = specific || a.title || '';
  LB.idx.textContent = String(LB.index + 1);
  LB.total.textContent = String(a.photos.length);

  const multi = a.photos.length > 1;
  LB.btnPrev.classList.toggle('d-none', !multi);
  LB.btnNext.classList.toggle('d-none', !multi);
  // optionnel : cacher aussi l’overlay nav cliquable
  LB.root.querySelector('.lb-nav')?.classList.toggle('d-none', !multi);
}

qInput.addEventListener('input', debounce(()=>{
  state.q = qInput.value.trim();
  resetAndReload();
}, 250));

qClear.addEventListener('click', ()=>{
  if (!qInput.value) return;
  qInput.value = '';
  state.q = '';
  resetAndReload();
});

// Brancher les boutons + clavier
LB.btnPrev.addEventListener('click', ()=> lbMove(-1));
LB.btnNext.addEventListener('click', ()=> lbMove(+1));
LB.btnClose.addEventListener('click', lbClose);
LB.btnDelete.addEventListener('click', async ()=>{
  const a = albums.get(LB.albumKey);
  const p = a?.photos?.[LB.index];
  if (!p) return;

  const ask = async () => {
    if (window.Swal) {
      const r = await Swal.fire({
        title: 'Supprimer cette photo ?',
        text: p.base || p.name || '',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonText: 'Supprimer',
        cancelButtonText: 'Annuler',
        confirmButtonColor: '#d33',
        reverseButtons: true,
      });
      return r.isConfirmed;
    }
    // Fallback natif
    return confirm('Supprimer cette photo ?');
  };

  if (!(await ask())) return;

  // Suppression côté serveur (réutilise l’endpoint existant)
  try {
    const fd = new FormData();
    // ⚠️ p.name contient le nom de fichier AVEC extension (ex: "Photo-0001.webp")
    fd.append('filename', p.name);
    const resp = await fetch(
      `/delete_photo/${encodeURIComponent(a.entity)}/${encodeURIComponent(a.id)}`,
      { method: 'POST', body: fd, headers: { 'X-Requested-With': 'fetch' } }
    );
    if (!resp.ok) {
      if (window.Swal) await Swal.fire('Erreur', 'La suppression a échoué côté serveur.', 'error');
      return;
    }
  } catch (e) {
    if (window.Swal) await Swal.fire('Erreur', 'La suppression a échoué (réseau).', 'error');
    return;
  }

  // Mise à jour locale
  a.photos.splice(LB.index, 1);
  if (!a.photos.length){
    a.cardEl.remove();
    albums.delete(LB.albumKey);
    lbClose();
    return;
  }
  updateAlbumUI(LB.albumKey);
  LB.index = Math.min(LB.index, a.photos.length - 1);
  lbRender();

  if (window.Swal) {
    Swal.fire({ toast:true, position:'top', timer:1500, showConfirmButton:false,
      icon:'success', title:'Photo supprimée' });
  }
});

document.addEventListener('keydown', (e)=>{
  if(!LB.root.classList.contains('open')) return;
  const a = albums.get(LB.albumKey);
  if(!a) return;
  const multi = a.photos.length > 1;
  if(multi && e.key === 'ArrowLeft')  lbMove(-1);
  if(multi && e.key === 'ArrowRight') lbMove(+1);
  if(e.key === 'Escape') lbClose();
});

// === RENDU ALBUMS ============================================================
function createAlbumCard(entity, id, title) {
  const card = document.createElement('div');
  card.className = 'album-card tile';
  card.dataset.entity = entity;
  card.dataset.id = id;
  card.dataset.key = `${entity}:${id}`;

  card.innerHTML = `
  <div class="thumb-wrap">
    <img class="thumb" alt="">
    <span class="badge-chip d-none album-count" title="Nombre de photos">
      <i class="bi bi-images"></i>
      <span class="count">0</span>
    </span>
  </div>
  <div class="meta">
    <div class="line1">
      <strong class="text-truncate album-title" title="${title}">${title}</strong>
      <div class="actions ms-auto">
        <button class="btn btn-sm btn-outline-secondary js-actions-btn" type="button"
                title="Actions" aria-label="Actions">
          <i class="bi bi-three-dots"></i>
        </button>
      </div>
    </div>
  </div>
`;

  // Clic carte = ouvrir lightbox
  card.addEventListener('click', () => {
    const a = albums.get(card.dataset.key);
    if (a) lbOpen(card.dataset.key, 0);
  });
  
  // Empêcher la lightbox quand on clique dans le menu
card.querySelectorAll('.dropdown-menu').forEach(el=>{
  el.addEventListener('click', (e)=> e.stopPropagation());
});

const actionsBtn = card.querySelector('.js-actions-btn');
if (actionsBtn) {
  actionsBtn.addEventListener('click', (e) => {
    e.preventDefault();
    e.stopPropagation(); // ne pas ouvrir la lightbox
    openActionsModal(card); // 👈 affiche la modale centrée
  });
}

// Ouvrir MakerWorld (si présent)
const mwItem = card.querySelector('.js-open-makerworld');
if (mwItem) {
  mwItem.addEventListener('click', (e)=> {
    // on laisse le navigateur ouvrir le lien, mais on bloque la lightbox
    e.stopPropagation();
  });
}

// Ouvrir la modal des filaments
const viewF = card.querySelector('.js-view-filaments');
if (viewF) {
  viewF.addEventListener('click', (e)=> {
    e.preventDefault();
    e.stopPropagation();
    showFilamentsFor(card); // fonction ajoutée plus bas
  });
}

  grid.appendChild(card);


  return card;
}
function renderPatchwork(card, photos){
  const img = card.querySelector('.thumb-wrap .thumb');
  const chip = card.querySelector('.thumb-wrap .album-count');
  const countSpan = card.querySelector('.thumb-wrap .album-count .count');
  if (!img) return;

  if (!photos.length){
    img.removeAttribute('src');
    img.alt = '';
    if (chip) { chip.classList.add('d-none'); if (countSpan) countSpan.textContent = '0'; }
    return;
  }

  const cover = photos[0];
  img.src = cover.url;
  img.alt = cover.base || cover.name || '';

  if (chip && countSpan){
    const count = photos.length;
    if (count > 1){
      chip.classList.remove('d-none');
      countSpan.textContent = '×'+String(count);
    } else {
      chip.classList.add('d-none');
      countSpan.textContent = '0';
    }
  }
}

function updateAlbumUI(key){
  const a = albums.get(key);
  if(!a || !a.cardEl) return;

  // Met à jour l'image de couverture + chip compteur
  renderPatchwork(a.cardEl, a.photos);

  // Lien MakerWorld (toujours serré à droite)
const mwItem = a.cardEl.querySelector('.js-open-makerworld');
if (mwItem) {
  if (a.makerworldUrl) {
    mwItem.href = a.makerworldUrl;
    mwItem.classList.remove('d-none');
  } else {
    mwItem.removeAttribute('href');
    mwItem.classList.add('d-none');
  }
}
}

function addPhotoToAlbum(item){
  const parsed = parseAlbumKeyFromUrl(item.url || item.path || item.src);
  if(!parsed) return;
  const { key, entity, id } = parsed;

  if(!albums.has(key)){
    const title = albumTitle(entity, id, item.item_title);
    const cardEl = createAlbumCard(entity, id, title);
    cardEl.dataset.key = key;
    albums.set(key, { entity, id, title, cardEl, photos: [], makerworldUrl: null });
  }
  const a = albums.get(key);

  // URL MakerWorld
  const mw = item.makerworld_url || item.makerworldUrl || null;
  if (mw && !a.makerworldUrl) a.makerworldUrl = mw;

  // Ajout de la photo si nouvelle
  const url = item.url || item.path || item.src;
  if (url && !a.photos.some(p => p.url === url)){
    a.photos.push({ url, name:item.name, base:item.base_name });
  }

  // Mise à jour UI
  updateAlbumUI(key);
}
(() => {
  let startX = 0, startY = 0, dx = 0, dy = 0, active = false, lockedAxis = null;
  const THRESH = 48;   // distance minimale pour changer d'image
  const LOCK = 10;     // distance pour “locker” l’axe

  const onStart = (e) => {
    if (!LB.root.classList.contains('open')) return;
	 // ✅ désactive swipe si une seule photo
  const a = albums.get(LB.albumKey);
  if (!a || a.photos.length < 2) return;
    const t = e.touches ? e.touches[0] : e;
    startX = t.clientX; startY = t.clientY;
    dx = dy = 0; active = true; lockedAxis = null;
  };

  const onMove = (e) => {
    if (!active) return;
    const t = e.touches ? e.touches[0] : e;
    dx = t.clientX - startX;
    dy = t.clientY - startY;
    if (!lockedAxis && (Math.abs(dx) > LOCK || Math.abs(dy) > LOCK)) {
      lockedAxis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
    }
    if (lockedAxis === 'x') {
      // on consomme l’événement pour éviter le scroll de page
      e.preventDefault();
      // (optionnel) feedback visuel : translate légère de l’image
      LB.img.style.transform = `translateX(${dx * 0.08}px)`;
    }
  };

  const onEnd = () => {
    if (!active) return;
    active = false;
    LB.img.style.transform = '';
    if (lockedAxis === 'x') {
      if (dx > THRESH)      lbMove(-1);
      else if (dx < -THRESH) lbMove(+1);
    }
  };

  LB.root.addEventListener('touchstart', onStart, { passive: true });
  LB.root.addEventListener('touchmove',  onMove,  { passive: false }); // ⚠️ pour pouvoir preventDefault
  LB.root.addEventListener('touchend',   onEnd,   { passive: true });
})();

async function showFilamentsFor(card){
  const entity = card.dataset.entity; // "prints" | "groups"
  const id = parseInt(card.dataset.id, 10);
  let url;
  if (entity === 'prints') url = `/history/${id}/filaments`;
  else if (entity === 'groups') url = `/groups/${id}/filaments`;
  else return;

  const listEl = document.getElementById('filamentsList');
  listEl.innerHTML = `<div class="text-secondary">Chargement…</div>`;

  try{
    const r = await fetch(url, { credentials:'same-origin' });
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
    const data = await r.json(); // [{spool_id, grams_used, name, color}]
    renderFilamentsList(listEl, data);
  }catch(err){
    listEl.innerHTML = `<div class="text-danger">Erreur de chargement</div>`;
    console.error(err);
  }

  const modalEl = document.getElementById('filamentsModal');
  const modal = bootstrap.Modal.getOrCreateInstance(modalEl);
  modal.show();
}

function renderFilamentsList(container, items){
  if (!items || !items.length){
    container.innerHTML = `<div class="text-secondary">Aucun filament</div>`;
    return;
  }
  items = [...items].sort((a,b)=> (b.grams_used||0)-(a.grams_used||0));

  const fmt = (g) => {
    if (g == null) return '';
    const n = Math.round(Number(g) * 10) / 10;
    return `${n} g`;
  };

  container.innerHTML = '';
  for (const it of items){
    const color = (it.color || '').toString().trim();
    const name = (it.name || '').toString().trim() || 'N/A';
    const searchname = (it.name || '').toString().trim() || 'N/A';
    const grams = fmt(it.grams_used);

    const row = document.createElement('div');
    row.className = 'fila-row d-grid align-items-center';
    row.style.gridTemplateColumns = 'auto 1fr auto';
    row.style.gap = '.5rem';
    row.innerHTML = `
      <span class="fila-swatch" style="${color ? `width:14px;height:14px;border-radius:9999px;background:${color};border:1px solid rgba(0,0,0,.2);box-shadow: inset 0 0 0 1px rgba(255,255,255,.15);` : 'width:14px;height:14px;border-radius:9999px;background:transparent;border:1px solid var(--bs-border-color)'}"></span>
      <span class="fila-name"><a href="#" class="js-filter-by-filament" data-term="${searchname.replace(/"/g,'&quot;')}">${name}</a></span>
      <span class="fila-qty text-nowrap text-secondary">${grams}</span>
    `;
    row.querySelector('.js-filter-by-filament').addEventListener('click', (e)=>{
      e.preventDefault();
      applySearch(searchname);
      const modal = bootstrap.Modal.getInstance(document.getElementById('filamentsModal'));
      if (modal) modal.hide();
    });

    container.appendChild(row);
  }
}

function applySearch(term){
  const input = document.getElementById('q');
  if (!input) return;
  input.value = term;
  state.q = term;
  resetAndReload();
}
// === DATA LOADING ============================================================


async function loadNext(){
  if (state.loading || state.done) return;
  state.loading = true;
  sentinel.textContent = 'Chargement…';

  try {
    const response = await fetch(buildUrl(), { credentials: 'same-origin' });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);

    const data = await response.json();

    (data.items || []).forEach(addPhotoToAlbum);
    state.page += 1;
    state.done = !data.has_more;

    if (albums.size === 0 && state.done){
      sentinel.classList.add('empty');
      sentinel.textContent = state.q
        ? `Aucun résultat pour « ${state.q} »`
        : 'Aucun élément';
    } else {
      sentinel.classList.remove('empty');
      sentinel.textContent = state.done
        ? '— fin —'
        : 'Descendez pour charger la suite…';
    }
  } catch (err) {
    console.error('[gallery] loadNext failed:', err);
    sentinel.classList.add('empty');
    sentinel.textContent = 'Erreur de chargement';
  } finally {
    state.loading = false;
  }
}
const io = new IntersectionObserver((entries)=>{
  if(entries.some(e=>e.isIntersecting)) loadNext();
});
io.observe(sentinel);

// Boot
loadNext();
</script>
