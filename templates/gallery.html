{% extends "base.html" %}

{% block styles %}
<style>
    :root { --thumb-size: 180px; }
    html, body { height: 100%; }
    body { margin: 0; overflow-y: auto; background: var(--bs-body-bg); }
.gallery-header {
  position: sticky;
  /* colle sous la navbar mesurée dans base.html */
  top: var(--nav-h, 0);
  z-index: 1010;
  backdrop-filter: blur(6px);
  background: color-mix(in oklab, var(--bs-body-bg) 85%, transparent);
  border-bottom: 1px solid rgba(255,255,255,.08);
}
    .gallery-title {
      font-size: 1rem; margin: 0; line-height: 1;
    }
     /* au lieu de .grid / .thumb */
.g-grid {
  --g-thumb-size: 180px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(var(--g-thumb-size), 1fr));
  gap: .75rem;
}

.g-thumb {
  position: relative;
  border-radius: .75rem;
  overflow: hidden;
  background: rgba(255,255,255,.03);
  border: 1px solid rgba(255,255,255,.06);
  aspect-ratio: 1 / 1;
  cursor: zoom-in;
  min-width: var(--g-thumb-size);
  min-height: var(--g-thumb-size);
}

.g-thumb img {
  width: 100%; height: 100%;
  object-fit: cover; object-position: center; display: block;
}

.g-thumb .name {
  position: absolute; left: .5rem; bottom: .5rem;
  background: rgba(0,0,0,.55); color: #fff;
  padding: .15rem .5rem; border-radius: .35rem;
  font-size: .8rem; max-width: 90%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  pointer-events: none;
}

.g-thumb .del { position: absolute; top: .35rem; right: .35rem; z-index: 2; }

    /* Lightbox */
    .lightbox {
      position: fixed; inset: 0; z-index: 2000; display: none;
      background: rgba(0,0,0,.92);
    }
    .lightbox.open { display: grid; place-items: center; }
    .lightbox img {
      max-width: 92vw; max-height: 86vh; object-fit: contain; box-shadow: 0 0 0 1px rgba(255,255,255,.08);
      border-radius: .5rem;
    }
    .lb-toolbar {
      position: fixed; top: .5rem; left: .5rem; right: .5rem; display: flex; align-items: center; justify-content: space-between; gap: .5rem;
    }
    .lb-actions { display: flex; gap: .5rem; }
    .lb-index { color: #fff; opacity: .8; font-size: .9rem; }
    .lb-nav {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: space-between; pointer-events: none;
    }
    .lb-nav .btn {
      pointer-events: all; border-radius: 999px;
    }
    @media (max-width: 576px) {
      :root { --thumb-size: 140px; }
      .lb-index { display: none; }
    }
	/* Réordonnancement dans la grille */
.g-grid.reorder-on .g-thumb { cursor: grab; }
.g-thumb.dragging { opacity:.85; transform: scale(.98); z-index: 5; }
.g-thumb .order-badge{
  position:absolute; top:.4rem; left:.4rem;
  background:#ffc107; color:#000; border-radius:999px;
  padding:.1rem .45rem; font-weight:700; font-size:.8rem;
  box-shadow:0 0 .4rem rgba(0,0,0,.45); display:none;
}
.g-grid.reorder-on .order-badge{ display:block; }
/* Verrouillage des vignettes non réordonnables (Impression …) */
.g-thumb.locked { opacity: .55; cursor: not-allowed; }
.g-thumb.locked .order-badge { display: none; }
.g-thumb .lock-badge {
  position: absolute; bottom: .4rem; right: .4rem;
  background: rgba(0,0,0,.6); color:#fff; padding:.1rem .35rem; border-radius:.35rem; font-size:.75rem;
}
@media (max-width: 576px) {
  /* 3 colonnes strictes */
  .g-grid { 
    grid-template-columns: repeat(2, 1fr);
  }
  /* permettre au grid de calculer la largeur -> carrés via aspect-ratio */
  .g-thumb { 
    min-width: 0; 
    min-height: 0; 
  }
  .lb-index { display: none; }
}
.g-grid.reorder-on,
.g-grid.reorder-on * {
  touch-action: none;
}
  </style>
{% endblock %}

{% block content %}

<div class="gallery-header py-2">
  <div class="container d-flex justify-content-between align-items-center">
    <div class="small text-body-secondary">
      <span id="jsCount">0</span> photo(s)
    </div>
    <div class="d-flex gap-2" data-requires-write>
      <button id="btnReorder" class="btn btn-sm btn-outline-light">🔀 Réorganiser</button>
      <div id="reorderActions" class="d-none">
        <button id="btnReorderSave" class="btn btn-sm btn-primary">Enregistrer</button>
        <button id="btnReorderCancel" class="btn btn-sm btn-secondary">Annuler</button>
      </div>
    </div>
  </div>
</div>

<main class="container py-3">
  <div id="grid" class="g-grid"></div>
</main>

<!-- Lightbox -->
<div id="lightbox" class="lightbox" aria-hidden="true">
  <div class="lb-toolbar">
    <div class="lb-actions">
      <button id="lbClose" class="btn btn-light btn-sm" title="Fermer (Esc)"><i class="bi bi-x-lg"></i></button>
      <button id="lbDelete" class="btn btn-danger btn-sm" title="Supprimer" data-requires-write><i class="bi bi-trash3"></i></button>
      <span id="lbName" class="badge text-bg-dark"></span>
    </div>
    <div class="lb-index"><span id="lbIdx">1</span> / <span id="lbTotal">1</span></div>
  </div>
  <img id="lbImg" alt="">
  <div class="lb-nav px-2">
    <button id="lbPrev" class="btn btn-outline-light"><i class="bi bi-chevron-left"></i></button>
    <button id="lbNext" class="btn btn-outline-light"><i class="bi bi-chevron-right"></i></button>
  </div>
</div>
{% endblock %}
{% block scripts %}
{{ super() }}

{# Injection serveur facultative quand on POST /gallery #}
{% if images %}
<script>
  window.__IMAGES__ = {{ images|tojson }};
  {% if title %}window.__TITLE__ = {{ title|tojson }};{% endif %}
</script>
{% endif %}

<script>
(function () {
  'use strict';

  // --- Source des images ---
  function parseImagesFromQuery() {
    try {
      var p   = new URLSearchParams(location.search);
      var raw = p.get('images') || p.get('imgs');
      if (!raw) return null;

      // URLSearchParams renvoie déjà décodé ; on tente JSON direct
      var arr = null;
      try { arr = JSON.parse(raw); }
      catch(e1) {
        try { arr = JSON.parse(decodeURIComponent(raw)); }
        catch(e2) {
          console.error('parseImagesFromQuery failed', e1, e2);
          return null;
        }
      }
      if (!Array.isArray(arr)) return null;
      var out = [];
      for (var i=0;i<arr.length;i++) {
        var it = arr[i] || {};
        var url = it.url || it.href || it.src || '';
        if (url) out.push({ url: url, name: it.name || '' });
      }
      return out;
    } catch (e) {
      console.error('parseImagesFromQuery exception', e);
      return null;
    }
  }

  var images = (window.__IMAGES__ && Array.isArray(window.__IMAGES__)) ? window.__IMAGES__ : (parseImagesFromQuery() || []);
  var title  = (typeof window.__TITLE__ === 'string' && window.__TITLE__) ? window.__TITLE__ : (new URLSearchParams(location.search).get('title') || '');

  // --- Header (protégé si l’élément n’existe pas) ---
  var titleEl = document.getElementById('jsTitle');
  if (titleEl) titleEl.textContent = title ? '— ' + title : '';
  var countEl = document.getElementById('jsCount');
  if (countEl) countEl.textContent = images.length;

  // --- Grille ---
  var grid = document.getElementById('grid');
  if (!grid) {
    console.error('[gallery] #grid introuvable');
    return; // <- dans l’IIFE, donc légal
  }

  function makeThumb(img, i) {
    var card = document.createElement('div');
    card.className = 'g-thumb';
    card.setAttribute('data-url', img.url);

    var del = document.createElement('button');
    del.type  = 'button';
    del.className = 'btn btn-sm btn-outline-light del js-del-photo';
    del.title = 'Supprimer';
    del.setAttribute('data-url', img.url);
    if (/\.3mf$/i.test(img.url)) del.style.display = 'none';
    del.setAttribute('data-requires-write','');
    del.innerHTML = '<i class="bi bi-x-lg"></i>';

    var im = document.createElement('img');
    im.src = img.url;
    im.alt = (img.name || '');

    var name = document.createElement('div');
    name.className = 'name';
    name.textContent = img.name || '';

    card.appendChild(del);
    card.appendChild(im);
    card.appendChild(name);

    card.addEventListener('click', function(e){
      if (e.target.closest('.js-del-photo')) return;
      openLightbox(i);
    });

    return card;
  }

  for (var i=0;i<images.length;i++) {
    grid.appendChild(makeThumb(images[i], i));
  }

  // --- Lightbox ---
  var lb      = document.getElementById('lightbox');
  var lbImg   = document.getElementById('lbImg');
  var lbName  = document.getElementById('lbName');
  var lbIdx   = document.getElementById('lbIdx');
  var lbTot   = document.getElementById('lbTotal');
  var lbPrev  = document.getElementById('lbPrev');
  var lbNext  = document.getElementById('lbNext');
  var lbDel   = document.getElementById('lbDelete');
  var lbClose = document.getElementById('lbClose');
  var index   = 0;

  if (lbTot) lbTot.textContent = String(images.length);

  function render() {
    var it = images[index] || null;
    if (lbImg)  lbImg.src        = it ? it.url  : '';
    if (lbName) lbName.textContent = it ? (it.name || '') : '';
    if (lbIdx)  lbIdx.textContent  = String(index + 1);
    if (lbDel)  lbDel.style.display = (it && !/\.3mf$/i.test(it.url)) ? '' : 'none';
  }

  function openLightbox(i) {
    index = i;
    render();
    lb.classList.add('open');
    lb.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
  }
  function closeLightbox() {
    lb.classList.remove('open');
    lb.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
  }
  function prev() { index = (index - 1 + images.length) % images.length; render(); }
  function next() { index = (index + 1) % images.length; render(); }

  if (lbPrev)  lbPrev.addEventListener('click', prev);
  if (lbNext)  lbNext.addEventListener('click', next);
  if (lbClose) lbClose.addEventListener('click', closeLightbox);

  document.addEventListener('keydown', function(e){
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape')    closeLightbox();
    if (e.key === 'ArrowLeft') prev();
    if (e.key === 'ArrowRight')next();
  });

  // --- Suppression ---
  async function deleteByUrl(fileUrl) {
  try {
    const abs = new URL(fileUrl, window.location.origin).href;

    const u = new URL(fileUrl, window.location.origin);
    const parts = u.pathname.split('/').filter(Boolean);
    const upIdx = parts.indexOf('uploads');
    if (upIdx < 0 || parts.length < upIdx + 4) return false;

    const entity   = parts[upIdx + 1];
    const entityId = parts[upIdx + 2];
    const filename = parts.slice(upIdx + 3).join('/');
    if (filename.toLowerCase().endsWith('.3mf')) return false;

    const ask = await Swal.fire({
      title: 'Supprimer la photo ?',
      text: filename,
      icon: 'warning',
      showCancelButton: true,
      confirmButtonText: 'Oui, supprimer',
      cancelButtonText: 'Annuler',
      confirmButtonColor: '#d33',
      cancelButtonColor: '#6c757d'
    });
    if (!ask.isConfirmed) return false;

    const fd = new FormData();
    fd.append('filename', filename);

    const resp = await fetch('/delete_photo/' + encodeURIComponent(entity) + '/' + encodeURIComponent(entityId), {
      method: 'POST',
      body: fd
    });
    if (!resp.ok) {
      Swal.fire('Erreur', 'La suppression a échoué.', 'error');
      return false;
    }

    // --- MAJ du modèle images (robuste absolu/relatif) ---
    const sameURL = (a,b) => {
      try { return new URL(a, location.origin).href === new URL(b, location.origin).href; }
      catch(_) { return a === b; }
    };
    let idx = images.findIndex(it =>
      sameURL(it.url, fileUrl) ||
      (function(){
        try {
          const A = new URL(it.url, location.origin);
          const B = new URL(fileUrl, location.origin);
          return A.pathname === B.pathname;
        } catch { return false; }
      })()
    );
    if (idx >= 0) images.splice(idx, 1);

    // --- Retrait de la tuile dans le DOM (sans sélecteur CSS fragile) ---
    let tile = null;
    [...grid.querySelectorAll('.g-thumb')].some(el => {
      const du = el.getAttribute('data-url') || '';
      try {
        if (new URL(du, location.origin).href === abs) { tile = el; return true; }
      } catch {
        if (du === fileUrl) { tile = el; return true; }
      }
      // fallback par filename
      const meta = (function(){
        try {
          const uu = new URL(du, location.origin);
          const p  = uu.pathname.split('/').filter(Boolean);
          const i  = p.indexOf('uploads');
          if (i < 0 || p.length < i+4) return null;
          return p.slice(i+3).join('/');
        } catch { return null; }
      })();
      if (meta && meta === filename) { tile = el; return true; }
      return false;
    });
    if (tile) tile.remove();

    // Compteurs + lightbox
    if (countEl) countEl.textContent = String(images.length);
    if (lbTot)   lbTot.textContent   = String(images.length);
    if (images.length === 0) {
      closeLightbox();
    } else {
      if (typeof index === 'number' && index >= images.length) index = images.length - 1;
      render();
    }

    Swal.fire('Supprimé', 'La photo a été supprimée.', 'success');
    return true;

  } catch (err) {
    console.error(err);
    Swal.fire('Erreur', 'Une erreur est survenue.', 'error');
    return false;
  }
}

  document.addEventListener('click', function(e){
    var btn = e.target.closest('.js-del-photo');
    if (!btn) return;
    var url = btn.getAttribute('data-url') || '';
    deleteByUrl(url);
    e.stopPropagation();
  });

  if (lbDel) lbDel.addEventListener('click', function(){
    var it = images[index];
    if (it) deleteByUrl(it.url);
  });

})();
(function(){
  // --- outils communs ---
  function parseUploadPath(url){
    try {
      const u = new URL(url, window.location.origin);
      const parts = u.pathname.split('/').filter(Boolean);
      const upIdx = parts.indexOf('uploads');
      if (upIdx < 0 || parts.length < upIdx+4) return null;
      return {
        entity: parts[upIdx + 1],
        id:     Number(parts[upIdx + 2]),
        filename: parts.slice(upIdx + 3).join('/'),
      };
    } catch(_) { return null; }
  }
function isReservedFilename(name){
  const n = (name || '').toLowerCase();
  const isImpression = n.startsWith('impression ') || n.startsWith('impression%20')
                    || n.startsWith('impression_') || n.startsWith('impression-');
  const is3mf = n.startsWith('3mf');
  return isImpression || is3mf;
}

  // on ajoute un badge d'ordre sur chaque tuile
  function ensureOrderBadges(container){
  let k = 0;
  [...container.children].forEach((el) => {
    let b = el.querySelector('.order-badge');
    if (!b) { b = document.createElement('span'); b.className = 'order-badge'; el.appendChild(b); }
    if (el.dataset.locked === '1') b.textContent = '';
    else b.textContent = String(++k);
  });
}

  // --- Pointer-reorder (mobile OK) ---
  function enableGridPointerReorder(container){
  let dragging = null, placeholder = null, offsetX = 0, offsetY = 0, pid = null;

  function getClosest(x, y, excludeA, excludeB){
    const items = [...container.children].filter(el => el !== excludeA && el !== excludeB);
    let best = null, dist = Infinity;
    for (const el of items) {
      const b = el.getBoundingClientRect();
      const cx = b.left + b.width/2, cy = b.top + b.height/2;
      const d = (x - cx) * (x - cx) + (y - cy) * (y - cy);
      if (d < dist) { dist = d; best = el; }
    }
    return best;
  }

  function onPointerDown(e){
    const item = e.target.closest('.g-thumb');
    if (!item) return;

    // ⚠️ ne pas drag les vignettes verrouillées
    if (item.dataset.locked === '1') { e.preventDefault(); return; }

    // Empêche le scroll/zoom
    e.preventDefault();

    // Pointer capture = on reçoit tous les pointermove même si le doigt sort de l'élément
    pid = e.pointerId;
    try { item.setPointerCapture(pid); } catch(_) {}

    const r = item.getBoundingClientRect();
    offsetX = e.clientX - r.left;
    offsetY = e.clientY - r.top;

    placeholder = document.createElement('div');
    placeholder.className = 'g-thumb';
    placeholder.style.width  = r.width  + 'px';
    placeholder.style.height = r.height + 'px';
    container.insertBefore(placeholder, item.nextSibling);

    dragging = item;
    dragging.classList.add('dragging');
    dragging.style.position = 'fixed';
    dragging.style.left     = (e.clientX - offsetX) + 'px';
    dragging.style.top      = (e.clientY - offsetY) + 'px';
    dragging.style.width    = r.width  + 'px';
    dragging.style.height   = r.height + 'px';
    dragging.style.pointerEvents = 'none';
    dragging.style.willChange    = 'left, top';

    // NOTE: écoute sur l'item capturant → plus fiable que window sur iOS
    const onMove = (ev) => {
      // Bloque tout comportement par défaut (scroll) sur les moves
      ev.preventDefault();
      if (!dragging) return;

      dragging.style.left = (ev.clientX - offsetX) + 'px';
      dragging.style.top  = (ev.clientY - offsetY) + 'px';

      const near = getClosest(ev.clientX, ev.clientY, dragging, placeholder);
      if (!near) container.appendChild(placeholder);
      else container.insertBefore(placeholder, near);
    };

    const onUpOrCancel = () => {
      if (dragging) {
        placeholder.replaceWith(dragging);
        dragging.removeAttribute('style');
        dragging.classList.remove('dragging');
      }
      try { item.releasePointerCapture(pid); } catch(_) {}
      dragging = null; placeholder = null; pid = null;

      // Renumérote les badges des vignettes déplaçables
      ensureOrderBadges(container);

      item.removeEventListener('pointermove', onMove, {capture:false});
      item.removeEventListener('pointerup', onUpOrCancel, {capture:false});
      item.removeEventListener('pointercancel', onUpOrCancel, {capture:false});
    };

    // IMPORTANT: listeners NON-passive pour pouvoir preventDefault()
    item.addEventListener('pointermove', onMove, {passive:false});
    item.addEventListener('pointerup', onUpOrCancel, {passive:false});
    item.addEventListener('pointercancel', onUpOrCancel, {passive:false});
  }

  // Listener principal (non-passive pour pouvoir preventDefault au down)
  container.addEventListener('pointerdown', onPointerDown, {passive:false});

  // cleanup
  return () => {
    container.removeEventListener('pointerdown', onPointerDown, {passive:false});
  };
}


  // --- Intégration UI ---
  const grid = document.getElementById('grid');
  if (!grid) return;

  // enrichit les tuiles existantes (dataset + badge)
  [...grid.children].forEach(card => {
  const url  = card.getAttribute('data-url') || '';
  const meta = parseUploadPath(url);

  if (meta) {
    card.dataset.entity   = meta.entity;
    card.dataset.entityId = String(meta.id);
    card.dataset.filename = meta.filename;
  } else {
    // URL hors /static/uploads/... => non réordonnable
    card.dataset.locked = '1';
    card.classList.add('locked');
    const lock = document.createElement('span');
    lock.className = 'lock-badge'; lock.textContent = '🔒';
    card.appendChild(lock);
  }

  // Verrouille aussi les fichiers réservés (Impression…, .3mf)
  if (isReservedFilename(card.dataset.filename || '')) {
    card.dataset.locked = '1';
    card.classList.add('locked');
    if (!card.querySelector('.lock-badge')) {
      const lock = document.createElement('span');
      lock.className = 'lock-badge'; lock.textContent = '🔒';
      card.appendChild(lock);
    }
  }

  // Badge ordre (affiché en mode réordonnancement)
  if (!card.querySelector('.order-badge')) {
    const b = document.createElement('span');
    b.className = 'order-badge';
    card.appendChild(b);
  }
});
(function deriveEntityInfo(){
  // priorité à un hint via querystring ?entity=&id=
  const hint = getEntityHint();
  if (hint) {
    grid.dataset.entity = hint.entity;
    grid.dataset.entityId = String(hint.id);
  }
  // Sinon, prends la 1re vignette réordonnable comme référence
  if (!grid.dataset.entity || !grid.dataset.entityId) {
    for (const el of grid.children) {
      if (el.dataset.locked === '1') continue;
      if (el.dataset.entity && el.dataset.entityId) {
        grid.dataset.entity = el.dataset.entity;
        grid.dataset.entityId = el.dataset.entityId;
        break;
      }
    }
  }
  // Si on a une référence, on verrouille tout ce qui ne matche pas
  if (grid.dataset.entity && grid.dataset.entityId) {
    for (const el of grid.children) {
      const match = (el.dataset.entity === grid.dataset.entity) &&
                    (el.dataset.entityId === grid.dataset.entityId) &&
                    !!el.dataset.filename &&
                    el.dataset.locked !== '1';
      if (!match) {
        el.dataset.locked = '1';
        el.classList.add('locked');
        if (!el.querySelector('.lock-badge')) {
          const lock = document.createElement('span');
          lock.className = 'lock-badge'; lock.textContent = '🔒';
          el.appendChild(lock);
        }
      }
    }
  } else {
    // Aucune référence déductible → tout verrouiller et masquer le bouton
    for (const el of grid.children) {
      el.dataset.locked = '1';
      el.classList.add('locked');
      if (!el.querySelector('.lock-badge')) {
        const lock = document.createElement('span');
        lock.className = 'lock-badge'; lock.textContent = '🔒';
        el.appendChild(lock);
      }
    }
    const btn = document.getElementById('btnReorder');
    btn && btn.classList.add('d-none');
  }
})();

  const btnReorder      = document.getElementById('btnReorder');
  const rActions        = document.getElementById('reorderActions');
  const btnReorderSave  = document.getElementById('btnReorderSave');
  const btnReorderCancel= document.getElementById('btnReorderCancel');

  let cleanup = null;
  let reorderOn = false;

  function allSameEntityInfo(){
  const ent = grid.dataset.entity;
  const id  = Number(grid.dataset.entityId);
  if (!ent || !Number.isFinite(id)) return null;
  const movable = [...grid.children].filter(el => el.dataset.locked !== '1');
  return movable.length ? { entity: ent, id } : null;
}
  function getEntityHint(){
  const p = new URLSearchParams(location.search);
  const entity = (p.get('entity') || '').trim().toLowerCase();
  const id = Number(p.get('id') || p.get('entity_id') || NaN);
  return (entity && Number.isFinite(id)) ? { entity, id } : null;
}

function isReservedFilename(name){
  const n = (name || '').toLowerCase();
  const isImpression = n.startsWith('impression ') || n.startsWith('impression%20')
                    || n.startsWith('impression_') || n.startsWith('impression-');
  const is3mf = n.endsWith('.3mf');
  return isImpression || is3mf;
}

function parseUploadPath(url){
  try {
    const u = new URL(url, window.location.origin);
    const parts = u.pathname.split('/').filter(Boolean);
    const upIdx = parts.indexOf('uploads');
    if (upIdx < 0 || parts.length < upIdx+4) return null;
    return { entity: parts[upIdx+1], id: Number(parts[upIdx+2]), filename: parts.slice(upIdx+3).join('/') };
  } catch(_) { return null; }
}

  function enterReorder(){
    const info = allSameEntityInfo();
    if (!info) {
      Swal?.fire?.("Action impossible", "Cette galerie ne pointe pas vers une seule entité / id.", "warning");
      return;
    }
    reorderOn = true;
    grid.classList.add('reorder-on');
    ensureOrderBadges(grid);
    if (cleanup) cleanup();
    cleanup = enableGridPointerReorder(grid);
    if (btnReorder) btnReorder.classList.add('d-none');
    if (rActions)   rActions.classList.remove('d-none');
  }

  function leaveReorder(){
    reorderOn = false;
    grid.classList.remove('reorder-on');
    if (cleanup) { cleanup(); cleanup = null; }
    if (btnReorder) btnReorder.classList.remove('d-none');
    if (rActions)   rActions.classList.add('d-none');
  }

 async function saveReorder(){
  // 1) déduire l’entité/id (tu as déjà allSameEntityInfo, sinon lis dataset du grid)
  const info = (function(){
    const ent = grid.dataset.entity;
    const id  = Number(grid.dataset.entityId);
    if (!ent || !Number.isFinite(id)) return null;
    return { entity: ent, id };
  })();
  if (!info) { leaveReorder(); return; }

  // 2) ordre à envoyer = uniquement les filenames des tuiles NON verrouillées dans l’ordre visuel
  const movableTiles = [...grid.children].filter(el => el.dataset.locked !== '1' && el.dataset.filename);
  const order = movableTiles.map(el => el.dataset.filename);
  if (order.length < 2) { leaveReorder(); return; }

  try{
    const r = await fetch(`/api/${encodeURIComponent(info.entity)}/${encodeURIComponent(info.id)}/images/order`, {
      method: 'POST',
      headers: { 'Content-Type':'application/json' },
      body: JSON.stringify({ order })
    });
    if (!r.ok) throw new Error(String(r.status));
    const d = await r.json();

    // 3) le serveur renvoie la liste finale; on en extrait les NOUVEAUX noms/urls des éléments déplaçables
    const finalFiles = (d && d.files) || [];
    const finalMovable = finalFiles.filter(f => !isReservedFilename(f.filename));

    // 4) on met à jour chaque tuile déplaçable (même position DOM) avec le nouveau nom + URL
    for (let i = 0; i < movableTiles.length && i < finalMovable.length; i++) {
      const tile     = movableTiles[i];
      const newMeta  = finalMovable[i];

      tile.dataset.filename = newMeta.filename;
      tile.setAttribute('data-url', newMeta.url);

      const img = tile.querySelector('img');
      if (img) { img.src = newMeta.url; img.alt = newMeta.filename; }

      const del = tile.querySelector('.js-del-photo');
      if (del) del.setAttribute('data-url', newMeta.url);

      const name = tile.querySelector('.name');
      if (name) name.textContent = newMeta.filename;
    }

    // 5) renumérote les badges et sors du mode
    ensureOrderBadges(grid);
    Swal?.fire?.("OK", "Ordre appliqué.", "success");
  } catch(e) {
    console.error(e);
    Swal?.fire?.("Erreur", "Impossible d'appliquer l'ordre.", "error");
  } finally {
    leaveReorder();
  }
}

  if (btnReorder)      btnReorder.addEventListener('click', enterReorder);
  if (btnReorderSave)  btnReorderSave.addEventListener('click', saveReorder);
  if (btnReorderCancel)btnReorderCancel.addEventListener('click', leaveReorder);

  // Empêche l’ouverture de la lightbox quand on est en mode réordonnancement
  document.addEventListener('click', function(e){
    if (!reorderOn) return;
    if (e.target.closest('.g-thumb')) e.preventDefault();
  }, { capture:true });

})();
</script>
