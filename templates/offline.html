<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Hors ligne – OpenSpoolMan</title>
  <link rel="icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
  <meta name="theme-color" content="#0ea5e9" />
  <style>
    html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Noto Sans,sans-serif;background:#0b1220;color:#e6edf3}
    .wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:2rem}
    .card{max-width:560px;padding:2rem;border:1px solid rgba(255,255,255,.08);border-radius:16px;background:rgba(255,255,255,.03);backdrop-filter:blur(6px)}
    h1{margin:0 0 .5rem;font-size:1.5rem}
    p{opacity:.85;line-height:1.6}
    .btn{display:inline-block;margin-top:1rem;padding:.66rem 1rem;border-radius:12px;border:1px solid rgba(255,255,255,.12);text-decoration:none;color:inherit}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Vous êtes hors ligne</h1>
      <p>Certains contenus ne sont pas disponibles sans connexion. Réessayez quand vous serez de nouveau connecté.</p>
      <a class="btn" href="/">Retour à l’accueil</a>
    </div>
  </div>
</body>
</html>
